[workspace]
resolver = "2"
members = [
    "crates/drumpad-model",
    "crates/drumpad-samples",
    "crates/drumpad-engine",
    "crates/drumpad-audio",
    "crates/drumpad-input",
    "crates/drumpad-app",
    "crates/drumpad-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
