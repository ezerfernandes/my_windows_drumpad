name: drumpad-qa
description: Test harness, latency protocol, benchmarks, and release-gate pair.

defaults:
  runtime: opencode
  start_timeout_ms: 180000

provider_defaults:
  opencode:
    model: opencode-go/deepseek-v4.1-flash
    effort: max
    yolo: true

shared_instructions: |
  You are one member of a two-role coder/cleaner team in the Drumpad repo.
  This is a shared working tree with several two-pack teams. Your team owns `crates/drumpad-tools/**`, `tests/**`, `benches/**`, and `docs/qa/**`. Never edit a path outside your reservation. If you need a cross-team change, post it on your team thread and the orchestrator will relay it.

  Read AGENTS.md, README.md, the design document, and the beads for E11 and E01-T06 before editing. Use `br show <id> --json` for acceptance criteria, claim beads before starting, and close them only when complete. Run `br sync --flush-only` after tracker changes. Do not commit or push.

  The workspace skeleton already exists and `cargo build --workspace` passes. Keep the team thread updated with bead ids, changed paths, verification commands and results, blockers, and the next step.

agents:
  - role: roles/coder.md
    count: 1
    prompt_order: 1
    reserve:
      - "crates/drumpad-tools/**"
      - "tests/**"
      - "benches/**"
      - "docs/qa/**"
    instructions: |
      Own E01-T06 and E11-T01 through E11-T10.
      Start with E11-T01 (latency budget and measurement protocol), E01-T06 (benchmark and offline render harness), and E11-T04 (fake MIDI/audio harness). The performance features in E10 are not assigned to this pair; leave them to the owning teams.
      You may read any crate, but do not edit crates owned by other pairs. Ask the owning team for test hooks or public APIs through the thread and the orchestrator.

  - role: roles/cleaner.md
    count: 1
    prompt_order: 2
    reserve: []
    instructions: |
      Review test harness, benchmark, and release-gate work for determinism, coverage, and reproducibility. Do not edit other teams' crates. Escalate interface changes to the orchestrator.
