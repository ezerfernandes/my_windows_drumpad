[package]
name = "drumpad-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
drumpad-model = { path = "../drumpad-model" }
drumpad-samples = { path = "../drumpad-samples" }
drumpad-engine = { path = "../drumpad-engine" }
drumpad-audio = { path = "../drumpad-audio" }
drumpad-input = { path = "../drumpad-input" }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

# Native window + immediate-mode UI. Integrations are direct (not eframe) so
# keyboard events reach the input router on the winit event itself, before the
# next egui frame is built. See docs/architecture/interfaces.md.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "serde"] }
egui = "0.32"
egui-winit = { version = "0.32", default-features = false, features = ["clipboard", "links"] }
egui_glow = { version = "0.32", default-features = false, features = ["winit", "clipboard", "links"] }
glow = "0.16"

[target.'cfg(windows)'.dependencies]
glutin = { version = "0.32", default-features = false, features = ["wgl"] }
glutin-winit = { version = "0.5", default-features = false, features = ["wgl"] }

[target.'cfg(not(windows))'.dependencies]
glutin = { version = "0.32", default-features = false, features = ["egl", "glx"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "glx"] }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
# Windows icon and version resources for the release executable (E01-T05).
winresource = { workspace = true }
