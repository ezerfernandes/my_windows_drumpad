[package]
name = "drumpad-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
drumpad-model = { path = "../drumpad-model" }
drumpad-samples = { path = "../drumpad-samples" }
drumpad-engine = { path = "../drumpad-engine" }
drumpad-input = { path = "../drumpad-input", default-features = false }

[target.'cfg(windows)'.dependencies]
wasapi = "0.27.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[[bin]]
name = "latency-spike"
path = "src/bin/latency_spike.rs"
